[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimguard-backend"
version = "0.1.0"
description = "FastAPI and SQLite foundation for ClaimGuard motor invoice validation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "neo4j>=5.28,<6.0",
  "openpyxl>=3.1,<4.0",
  "pdfplumber>=0.11,<1.0",
  "pillow>=10.0,<13.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "pymupdf>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.12,<1.0",
  "pyyaml>=6.0,<7.0",
  "rapidfuzz>=3.9,<4.0",
  "reportlab>=4.2,<5.0",
  "sqlalchemy>=2.0.36,<3.0",
  "tenacity>=9.0,<10.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
local-ocr = [
  "pytesseract>=0.3.13,<1.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.8,<1.0",
  "pytesseract>=0.3.13,<1.0",
]

[project.scripts]
claimguard-bootstrap = "app.bootstrap:main"
claimguard-import-vehicle-lookup = "app.vehicle_lookup_import:main"
claimguard-import-external-benchmarks = "app.external_benchmark_import:main"
claimguard-probe = "app.llm.selftest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: integration tests over large PDF or OCR fixtures",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
